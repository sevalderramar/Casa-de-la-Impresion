spring.application.name=pedido-service
spring.profiles.active=h2

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

services.cliente.url=${CLIENTE_SERVICE_URL:http://localhost:8082}
services.producto.url=${PRODUCTO_SERVICE_URL:http://localhost:8083}
services.estado.url=${ESTADO_SERVICE_URL:http://localhost:8086}

spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:5000}
