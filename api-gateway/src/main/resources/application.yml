server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Gateway, api-gateway
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: pedido-service
              uri: lb://pedido-service
              predicates:
                - Path=/api/pedidos/**
            - id: cliente-service
              uri: lb://cliente-service
              predicates:
                - Path=/api/clientes/**
            - id: producto-service
              uri: lb://producto-service
              predicates:
                - Path=/api/productos/**
            - id: despacho-service
              uri: lb://despacho-service
              predicates:
                - Path=/api/despachos/**
            - id: fabricacion-service
              uri: lb://fabricacion-service
              predicates:
                - Path=/api/fabricacion/**
            - id: estado-service
              uri: lb://estado-service
              predicates:
                - Path=/api/estados/**
            - id: metrica-service
              uri: lb://metrica-service
              predicates:
                - Path=/api/metricas/**
            - id: transportista-service
              uri: lb://transportista-service
              predicates:
                - Path=/api/transportistas/**
            - id: log-service
              uri: lb://log-service
              predicates:
                - Path=/api/logs/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
